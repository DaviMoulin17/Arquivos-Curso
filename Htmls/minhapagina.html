<!DOCTYPE html>
<html lang="pt-br">
<head>
   <title>Minha Página</title>
   <!-- Importando CSS externo -->
   <link ref="styleheet" ref="style.css">
</head>
<style>

    /* Predefine (estrutura básica) as cores queo meu
    site irá usar */
    body{
        background-color: powderblue;
        font-family: Arial, sans-serif;
    }
    h1  {
        color: blue;
        text-align: center;
    }
    p   {
        color: gray;
        font-size: 20px;
        border: 2px solid green;
        padding: 18px;
        margin: 14px;
        }   


        /* Estilo de borda */
        p.dotted { border-style: dotted;}
        p.dashed { border-style: dashed;}
        p.solid  { border-style: solid;}
        p.double { border-style: double;}
        p.groove { border-style: groove;}
        p.ridge  { border-style: ridge;}
        p.inset  { border-style: inset;}
        p.outset { border-style: outset;}
        p.none   { border-style: none;}
        p.hidden { border-style: hidden;}
        p.mix    { border-style: dotted dashed solid double;}
    </style>
</head>

<bory>
    <h1>Exemplo de Bordas CSS</h1>

    <p class="dotted">Borda pontilhada</p>
    <p class="dashed">Borda tracejada</p>
    <p class="solid">Borda sólida</p>
    <p class="double">Borda dupla</p>
    <p class="groove">Borda em relevo (groove)</p>
    <p class="ridge">Borda elevada (ridge)</p>
    <p class="inset">Borda embutida (inset)</p>
    <p class="outset">Borda projetada (outset)</p>
    <p class="none">Sem borda</p>
    <p class="hidden">Borda oculta</p>
    <p class="mix">Borda de estilos</p>
</bory>
</html>
