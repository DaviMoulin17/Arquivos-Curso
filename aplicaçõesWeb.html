<!DOCTYPE html>
<html lang="pt-br">
<head>
 <meta charset="UTF-8">
 <title>Lista de Tarefas</title>
 <style>
body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: url('https://i.pinimg.com/736x/1e/82/6e/1e826eed3bcf1789e74f2fce229316c6.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #fcfcff;
    }

  .todo-box {
    width: 400px;                  
    padding: 30px;                 
    background-color: #2b2d42;    
    border: 2px solid #2b2d42;      
    border-radius: 12px;        
    box-shadow: 3px 3px 15px rgba(0, 0, 0, 0.2); 
    text-align: center;            
  }
  input {
    padding: 10px;
    border-radius: 6px;
    border: none;
    width: 250px;
    margin-right: 10px;
  }
  button {
    padding: 10px 15px;
    border-radius: 6px;
    border: none;
    background-color: #1fa045;
    color: #fff;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover {
    background-color: #24643a;
  }
  #lista {
   margin-top: 20px;
   padding: 0;
   align-items: center;
   display: flex;
   flex-direction: column;
  }
  li {
   list-style: none;
   margin: 5px;
   padding: 8px;
   background: #f0f0f0;
   color: #000000;
   border-radius: 4px;
   width: 300px;
   display: flex;
   justify-content:space-between;
   align-items: center;
  }
  li button {
    background-color: #d80229;
    padding: 5px 10px;
  }
  li button:hover {
    background-color: #ff3d6d;
  }
  
 </style>
 <script>
  function adicionarTarefa() {
   let input = document.getElementById("tarefa");
   let valor = input.value;
   if (valor === "") {
    alert("Digite uma tarefa!");
    return;
   }
   let li = document.createElement("li");
   li.innerText = valor;

   let botaoRemover = document.createElement("button");
   botaoRemover.innerText = "Remover";
   botaoRemover.onclick = function() {
    li.parentNode.removeChild(li);
   };

   li.appendChild(botaoRemover);
   document.getElementById("lista").appendChild(li);
   input.value = "";
  }
 </script>
</head>
<body>
<div class="todo-box">
 <h2>Minha Lista de Tarefas</h2>
 <input type="text" id="tarefa" placeholder="Digite uma tarefa">
 <button onclick="adicionarTarefa()">Adicionar</button>
 <ul id="lista"></ul>
</div>
</body>
</html>
