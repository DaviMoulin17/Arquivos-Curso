<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Formulário de Cadastro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f3f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      transition: background 0.3s, color 0.3s;
    }
    .card {
      background-color: #2b2d42;
      border: 2px solid #2b2d42;
      padding: 12px;
      width: 320px;
      box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.5);
      border-radius: 10px;
      transition: background 0.3s, border 0.3s;
    }
    .card h2 {
      text-align: center;
      margin-top: 0;
      color: #fff7f8;
    }
    label {
      display: block;
      margin-top: 8px;
      font-weight: bold;
      color: white;
    }
    input {
      width: 100%;
      padding: 6px;
      margin-top: 4px;
      box-sizing: border-box;
      border-radius: 5px;
      border: none;
      outline: none;
    }
    .actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      justify-content: space-between;
    }
    .actions input, .actions button {
      padding: 8px 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .actions input {
      background-color: #1fa045;
      color: #fff;
    }
    .btn-limpar {
      background-color: #b11b1b;
      color: #fff;
    }
    .btn-limpar:hover {
      background-color: #861f1f;
    }
    .btn-escuro {
      background-color: #0c4d8f;
      color: #fff;
    }
    .btn-escuro:hover {
      background-color: #3085da;
    }
    .actions input:hover {
      background-color: #355c42;
    }
    .dark-mode {
      background-color: #121212;
      color: #ffffff;
    }
    .dark-mode .card {
      background-color: #1e1e1e;
      border: 2px solid #ffffff;
    }
    .dark-mode .card h2,
    .dark-mode label {
      color: #ffffff;
    }
  </style>

  <script>
    function validarFormulario() {
      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value.trim();
      const telefone = document.getElementById("telefone").value.trim();
      const idade = document.getElementById("idade").value.trim();

      const telefoneRegex = /^\(?\d{2}\)?\s?\d{4,5}-?\d{4}$/;

      if (!nome || !email || !senha || !telefone || !idade) {
        alert("Por favor, preencha todos os campos!");
        return false;
      }
      if (!telefoneRegex.test(telefone)) {
        alert("Telefone inválido! Use formato (99) 99999-9999.");
        return false;
      }
      if (parseInt(idade) < 1) {
        alert("Idade inválida!");
        return false;
      }
      return true;
    }

    function enviarFormulario(event) {
      event.preventDefault();
      if (validarFormulario()) {
        alert("Cadastro realizado com sucesso!");
        document.getElementById("formCadastro").reset();
      }
    }

    function limparFormulario() {
      document.getElementById("formCadastro").reset();
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
    }
  </script>
</head>
<body>
  <div class="card">
    <h2>Cadastro</h2>
    <form id="formCadastro" onsubmit="enviarFormulario(event)">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome">

      <label for="email">E-mail</label>
      <input type="text" id="email" name="email">

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha">

      <label for="telefone">Telefone</label>
      <input type="tel" id="telefone" name="telefone" placeholder="(99) 99999-9999">

      <label for="idade">Idade</label>
      <input type="number" id="idade" name="idade" min="1" max="120">

      <div class="actions">
        <input type="submit" value="Cadastrar">
        <button type="button" class="btn-limpar" onclick="limparFormulario()">Limpar</button>
        <button type="button" class="btn-escuro" onclick="toggleDarkMode()">🌙 Escuro</button>
      </div>
    </form>
  </div>
</body>
</html>
